<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Número aleatorio</title>
</head>
<body>

    <h1 id="numero"></h1>

    <script>
        const numero = Math.floor(Math.random() * 10) + 1;
        document.getElementById("numero").textContent = numero;
    </script>

</body>
</html>
